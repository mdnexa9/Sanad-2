import { createRequire } from "node:module";

const require = createRequire(import.meta.url);
const { TwaGenerator, TwaManifest } = require("@bubblewrap/core");

class SilentPrompt {
  printMessage() {}
  printWarning() {}
  printError() {}
  async promptInput(_message, defaultValue = "") {
    return defaultValue;
  }
  async promptConfirm(_message, defaultValue = true) {
    return defaultValue;
  }
  async promptChoice(_message, choices = [], defaultValue) {
    if (typeof defaultValue === "number") return defaultValue;
    if (typeof defaultValue === "string") return defaultValue;
    return Array.isArray(choices) ? choices[0] : 0;
  }
  async promptPassword() {
    return "";
  }
}

const manifest = await TwaManifest.fromFile("twa-manifest.json");
const generator = new TwaGenerator();
await generator.createTwaProject(process.cwd(), manifest, new SilentPrompt());
console.log("TWA project generated");
